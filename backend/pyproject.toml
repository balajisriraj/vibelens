[project]
name = "vibelens"
version = "0.1.0"
description = "Watch less, know more: transcripts, chapters, key moments and a chat that cites the second."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "av>=14",
  "fastapi>=0.115",
  "fastembed>=0.4",
  "faster-whisper>=1.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "sqlite-vec>=0.1.6",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
  "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
postgres = ["pgvector>=0.3", "psycopg[binary]>=3.2"]

[project.scripts]
vibelens = "vibelens.cli:main"

[dependency-groups]
dev = ["pillow>=10", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibelens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
