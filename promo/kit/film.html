<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The film</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--stage); }
      body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
      #camera { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
      #camera.window { border-radius: 22px; box-shadow: 0 60px 140px -40px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .08); }
      #stage iframe { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; }
      #cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 10; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .35)); transform-origin: 4px 3px; }
      #ripple { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, .55); box-shadow: 0 0 0 2px rgba(0, 0, 0, .15); z-index: 9; opacity: 0; }
      #ring { position: absolute; z-index: 8; border-radius: 16px; box-shadow: 0 0 0 3px #fff, 0 0 0 7px rgba(0, 0, 0, .18), 0 18px 50px -10px rgba(0, 0, 0, .45); pointer-events: none; }

      #type { position: absolute; inset: 0; display: none; place-content: center; text-align: center; gap: 28px; padding: 0 140px; }
      #type .w { font-size: 150px; font-weight: 800; letter-spacing: -.045em; line-height: 1.0; }
      #type .w.m { font-size: 112px; } #type .w.s { font-size: 84px; letter-spacing: -.035em; line-height: 1.08; }
      #type .sub { font-size: 40px; font-weight: 500; letter-spacing: -.012em; line-height: 1.3; opacity: .66; max-width: 1300px; margin: 0 auto; }
      #type .eyebrow { font-size: 26px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
      #type .chips { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
      #type .chips span { font-size: 30px; font-weight: 600; padding: 14px 28px; border-radius: 999px; border: 2px solid currentColor; opacity: .85; }
      .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

      #caption { position: absolute; left: 50%; top: 40px; padding: 16px 34px 18px; border-radius: 26px; text-align: center; opacity: 0; z-index: 20;
        background: var(--cap-bg); color: var(--cap-ink); backdrop-filter: blur(24px) saturate(180%); box-shadow: var(--cap-shadow); }
      #caption .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #caption .title { font-size: 34px; font-weight: 700; letter-spacing: -.022em; margin-top: 2px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="camera">
      <div id="stage"></div>
      <div id="ring" style="display: none"></div>
      <div id="ripple"></div>
      <svg id="cursor" viewBox="0 0 26 26" style="display: none"><path d="M4 2 L4 21 L9 16.5 L12.6 24 L16 22.4 L12.4 15 L19 15 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" /></svg>
    </div>
    <div id="type"></div>
    <div id="caption"></div>
    <script>window.SNAPS = /*SNAPS*/;</script>
    <script src="film.js"></script>
  </body>
</html>
